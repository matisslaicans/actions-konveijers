name: python-greetings

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  install-pip-deps:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/depend
    
  deploy-to-dev:
    runs-on: self-hosted
    needs: install-pip-deps
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: deploy
        uses: ./.github/actions/deploy
        with:
          environment: dev
          port: "7001"
    
  tests-on-dev:
    runs-on: self-hosted
    needs: deploy-to-dev
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: tests
        uses: ./.github/actions/test
        with:
          environment: dev
    
  deploy-to-stg:
    runs-on: self-hosted
    needs: tests-on-dev
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: deploy
        uses: ./.github/actions/deploy
        with:
          environment: stg
          port: "7002"

  tests-on-stg:
    runs-on: self-hosted
    needs: deploy-to-stg
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: tests
        uses: ./.github/actions/test
        with:
          environment: stg
    
  deploy-to-preprod:
    runs-on: self-hosted
    needs: tests-on-stg
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: deploy
        uses: ./.github/actions/deploy
        with:
          environment: preprod
          port: "7003"    
    
  tests-on-preprod:
    runs-on: self-hosted
    needs: deploy-to-preprod
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: tests
        uses: ./.github/actions/test
        with:
          environment: preprod    
    
  deploy-to-prod:
    runs-on: self-hosted
    needs: tests-on-preprod
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: deploy
        uses: ./.github/actions/deploy
        with:
          environment: prod
          port: "7004"

    
  Tests-on-prod:
    runs-on: self-hosted
    needs: deploy-to-prod
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: tests
        uses: ./.github/actions/test
        with:
          environment: prod
