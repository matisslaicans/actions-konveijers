name: tests
description: tests

inputs:
  environment:
    required: true

runs:
  using: composite
  steps:
    - name: clone repo
      uses: actions/checkout@v6
      with:
        repository: mtararujs/course-js-api-framework
        path: course-js-api-framework
    - shell: bash
      run: echo "testing"
    - name: npm
      shell: bash
      working-directory: course-js-api-framework
      run: npm install
    - name: tests
      shell: bash
      working-directory: course-js-api-framework
      run: env=${{ inputs.environment }} npm run greetings
    - name: done
      shell: bash
      run: echo "tested"
