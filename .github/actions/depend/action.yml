name: Python dependencies
description: no description

runs:
  using: composite
  steps:
    - shell: bash
      run: echo "Dependencies"
      
    - name: v-env
      shell: bash
      working-directory: python-greetings
      run: python3 -m venv venv

    - name: requirements
      shell: bash
      working-directory: python-greetings
      run: ./venv/bin/python -m pip install -r requirements.txt

    - shell: bash
      run: echo "Installed"
